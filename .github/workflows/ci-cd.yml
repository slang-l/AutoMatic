name: CI
run-name: CI ${{ github.ref_name }} ${{ inputs.note }}
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      note:
        description: 操作备注（可选）
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: automatic_ci
          POSTGRES_USER: automatic_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U automatic_ci -d automatic_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COLLABORATION_TEST_DATABASE_URL: postgresql://automatic_ci:ci-only-password@127.0.0.1:5432/automatic_ci
      ARTICLE_TEST_DATABASE_URL: postgresql://automatic_ci:ci-only-password@127.0.0.1:5432/automatic_ci
      CI_TEST_DATABASE_URL: postgresql://automatic_ci:ci-only-password@127.0.0.1:5432/automatic_ci
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Reproduce local BlockSuite fixes
        run: node scripts/apply-blocksuite-patches.mjs
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment scripts and configuration formatting
        run: |
          shellcheck ops/*.sh
          pnpm format:check
      - name: Verify automatic recovery with an isolated service
        run: |
          sudo bash ops/test-release-recovery.sh
          sudo bash ops/test-release-operations.sh
      - name: Typecheck, tests including PostgreSQL, and production builds
        run: pnpm check
      - name: Release identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: version
        run: echo "release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Package once, verify the actual runtime package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          RELEASE_ID: ${{ steps.version.outputs.release }}
        run: |
          bash ops/package-release.sh "$RELEASE_ID" "$GITHUB_SHA"
          mkdir -p .tmp/smoke-release
          tar -xzf ".tmp/artifacts/$RELEASE_ID.tar.gz" -C .tmp/smoke-release
          node scripts/smoke-release.mjs .tmp/smoke-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: release-${{ steps.version.outputs.release }}
          path: .tmp/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish CI summary
        if: success()
        env:
          RELEASE_ID: ${{ steps.version.outputs.release }}
        run: |
          echo '类型、测试、PostgreSQL 和生产构建验证通过。' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$RELEASE_ID" ]]; then
            echo "已验证发布包：\`$RELEASE_ID\`，保留 30 天。可通过 Deploy production 直接部署，或通过 Publish release 永久保存。" >> "$GITHUB_STEP_SUMMARY"
          fi
