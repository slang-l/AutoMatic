name: CI and Deploy
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: automatic_ci
          POSTGRES_USER: automatic_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U automatic_ci -d automatic_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COLLABORATION_TEST_DATABASE_URL: postgresql://automatic_ci:ci-only-password@127.0.0.1:5432/automatic_ci
      CI_TEST_DATABASE_URL: postgresql://automatic_ci:ci-only-password@127.0.0.1:5432/automatic_ci
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Reproduce local BlockSuite fixes
        run: node scripts/apply-blocksuite-patches.mjs
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment scripts and configuration formatting
        run: |
          shellcheck ops/*.sh
          pnpm format:check
      - name: Verify automatic recovery with an isolated service
        run: sudo bash ops/test-release-recovery.sh
      - name: Typecheck, tests including PostgreSQL, and production builds
        run: pnpm check
      - name: Release identity
        id: version
        run: echo "release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Package once, verify the actual runtime package
        env:
          RELEASE_ID: ${{ steps.version.outputs.release }}
        run: |
          bash ops/package-release.sh "$RELEASE_ID" "$GITHUB_SHA"
          mkdir -p .tmp/smoke-release
          tar -xzf ".tmp/artifacts/$RELEASE_ID.tar.gz" -C .tmp/smoke-release
          node scripts/smoke-release.mjs .tmp/smoke-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.version.outputs.release }}
          path: .tmp/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  deploy:
    name: Deploy production
    needs: check
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      github.repository == 'slang-l/AutoMatic' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://180.76.248.209
    concurrency:
      group: automatic-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ needs.check.outputs.release }}
          path: artifact
      - uses: ./.github/actions/prepare-ssh
        with:
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
      - name: Upload and activate the verified artifact
        env:
          RELEASE_ID: ${{ needs.check.outputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          scp "artifact/$RELEASE_ID.tar.gz" "artifact/$RELEASE_ID.sha256" automatic-production:/srv/automatic/incoming/
          ssh automatic-production "sudo -n /usr/local/sbin/automatic-release deploy $RELEASE_ID"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://180.76.248.209/api/health
          echo "Deployed $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private key
        if: always()
        run: rm -f ~/.ssh/automatic_deploy
