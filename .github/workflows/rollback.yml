name: Rollback production
on:
  workflow_dispatch:
    inputs:
      release:
        description: Existing server release directory name; confirm schema compatibility first
        required: true
        type: string
permissions:
  contents: read
jobs:
  rollback:
    if: github.ref == 'refs/heads/master' && github.repository == 'slang-l/AutoMatic' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://180.76.248.209
    concurrency:
      group: automatic-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-ssh
        with:
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
      - name: Roll back code to an existing version
        env:
          RELEASE_ID: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          ssh automatic-production "sudo -n /usr/local/sbin/automatic-release rollback $RELEASE_ID"
          curl --fail --silent --show-error https://180.76.248.209/api/health
          echo "Rolled back code to $RELEASE_ID; database was not restored." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private key
        if: always()
        run: rm -f ~/.ssh/automatic_deploy
