name: Prepare deployment SSH
description: Load the deployment key and pinned server host key
inputs:
  private-key:
    required: true
    description: OpenSSH private key
  known-hosts:
    required: true
    description: Verified OpenSSH known_hosts contents
  host:
    required: true
    description: Server IPv4 address or DNS name
  port:
    required: false
    default: '22'
    description: Server SSH port
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.private-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$ ]]
        [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ && $DEPLOY_PORT -le 65535 ]]
        test -n "$DEPLOY_KEY"
        test -n "$KNOWN_HOSTS"
        install -d -m 700 ~/.ssh
        umask 077
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/automatic_deploy
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        ssh-keygen -y -f ~/.ssh/automatic_deploy >/dev/null
        host_key=$DEPLOY_HOST
        if [[ "$DEPLOY_PORT" != 22 ]]; then host_key="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
        ssh-keygen -F "$host_key" -f ~/.ssh/known_hosts >/dev/null
        cat > ~/.ssh/config <<EOF
        Host automatic-production
          HostName $DEPLOY_HOST
          User automatic-deploy
          Port $DEPLOY_PORT
          IdentityFile ~/.ssh/automatic_deploy
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking yes
          ConnectTimeout 15
          ServerAliveInterval 15
          ServerAliveCountMax 3
        EOF
